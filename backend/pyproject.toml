[project]
name = "aisw"
version = "0.0.1"
description = "Agentic Infrastructure Security Warden - read-only, evidence-first assessment platform"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.14",
  "cryptography>=43",
  "fastapi>=0.115",
  "psycopg[binary]>=3.2",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0",
  "uvicorn>=0.32",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "httpx>=0.27",
  "mypy>=1.13",
  "ruff>=0.8",
  "pip-audit>=2.7",
  "pgserver>=0.1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aisw"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["E501"]  # the formatter wraps code; long SQL/message strings are acceptable

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "SIM117", "S608", "S105"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["aisw", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "security: negative/abuse tests that must always pass",
  "evaluation: LLM evaluation tests (skipped when AI is disabled)",
]
